[package]
name = "ray-tracer-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ray-tracer-core = { path = "../ray-tracer-core" }
wasm-bindgen = "0.2"
rand = { workspace = true }
image = "0.25.5"
getrandom = { version = "0.3.1", features = ["wasm_js"] }


[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]